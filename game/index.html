<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1B1F4B">
<title>Игра</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- Заставка -->
  <section class="screen" id="screen-intro">
    <div class="topbar">
      <button class="icon-btn" id="btn-close" aria-label="Выйти">✕</button>
      <button class="icon-btn" id="btn-sound" aria-label="Звук">🔇</button>
    </div>
    <div class="center">
      <div class="hero" id="intro-emoji">🦊</div>
      <h1 id="intro-title">Название игры</h1>
      <p class="lead" id="intro-goal">Здесь цель обучения одной фразой.</p>
    </div>
    <div class="bottom">
      <button class="btn big" id="btn-play">Играть</button>
    </div>
  </section>

  <!-- Игра (шаблон: свайп-карточки) -->
  <section class="screen" id="screen-play">
    <div class="topbar">
      <button class="icon-btn" id="btn-close-play" aria-label="Выйти">✕</button>
      <div class="dots" id="dots"></div>
      <button class="icon-btn" id="btn-sound-play" aria-label="Звук">🔇</button>
    </div>
    <div class="stage">
      <div class="side-hint left" id="hint-left">Нет</div>
      <div class="side-hint right" id="hint-right">Да</div>
      <div class="card" id="card">
        <div class="card-emoji" id="card-emoji"></div>
        <div class="card-text" id="card-text"></div>
      </div>
    </div>
    <div class="actions">
      <button class="btn coral" id="btn-no">Нет</button>
      <button class="btn mint" id="btn-yes">Да</button>
    </div>
  </section>

  <!-- Итог -->
  <section class="screen" id="screen-result">
    <div class="center">
      <div class="stars" id="result-stars"></div>
      <h1 id="result-rank">Готово!</h1>
      <p class="lead" id="result-text"></p>
    </div>
    <div class="bottom col">
      <button class="btn big" id="btn-share">Поделиться</button>
      <button class="btn mint" id="btn-again">Ещё раз</button>
      <button class="btn ghost" id="btn-exit">Выйти</button>
    </div>
  </section>

</div>

<!-- Окно мягкой обратной связи (объяснение ошибки) -->
<div id="modal" class="modal" hidden>
  <div class="sheet">
    <div class="sheet-emoji" id="modal-emoji">🤔</div>
    <h2 id="modal-title">Хм</h2>
    <p id="modal-text"></p>
    <button class="btn" id="modal-btn">Понятно</button>
  </div>
</div>

<div id="toast" class="toast" hidden></div>
<canvas id="fx"></canvas>

<script src="js/core.js"></script>
<script src="js/bridge.js"></script>
<script src="js/audio.js"></script>
<script src="js/content.js"></script>
<script src="js/input.js"></script>
<script src="js/loop.js"></script>
<script src="js/fx.js"></script>
<script src="js/ui.js"></script>
<script src="js/share.js"></script>
<script src="js/screens.js"></script>
<script src="js/fallback.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
